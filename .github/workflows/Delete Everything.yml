name: Cleanup Repo

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message'
        required: false
        default: 'Cleanup extracted files'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete everything except workflows and README
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.github' ! -name 'README.md' ! -name '.git' -exec rm -rf {} +

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "${{ github.event.inputs.commit_message }}"
          git push
